[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontainy"
version = "0.0.1"
description = "Docker ve Podman'ın her ayarı, tek arayüzde — Linux masaüstü konteyner yönetim aracı"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bayram Kotan" }]
keywords = ["docker", "podman", "container", "kubernetes", "gui", "pyside6", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/bayramkotan/kontainy"
Repository = "https://github.com/bayramkotan/kontainy"

[project.scripts]
kontainy = "main:main"
kty = "main:main"

[tool.setuptools]
packages = [
    "src", "src.core", "src.core.catalog", "src.gui", "src.gui.pages",
    "src.rules", "src.learn", "src.utils",
]
py-modules = ["main"]
