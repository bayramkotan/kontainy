[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontainy"
version = "0.0.9"
description = "Every Docker and Podman setting, in one interface - a desktop manager for containers, with diagnostics and built-in learning"
# PyPI gets its own README, as VenvStudio does: the same text without
# the logo, the screenshots and the navigation links, which need the
# repository to make sense. README.md stays the one on GitHub.
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bayram Kotan" }]
keywords = [
    "docker", "podman", "container", "containers", "kubernetes", "quadlet",
    "systemd", "rootless", "oci", "devops", "gui", "pyside6", "qt", "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Installation/Setup",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Education",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/bayramkotan/kontainy"
Repository = "https://github.com/bayramkotan/kontainy"
Issues = "https://github.com/bayramkotan/kontainy/issues"
Changelog = "https://github.com/bayramkotan/kontainy/releases"

[project.scripts]
# `ky` is the short form, the way VenvStudio installs `vs` alongside its own
# name. `kty` is kept from 0.0.1 so nobody's muscle memory breaks.
kontainy = "kontainy.__main__:main"
ky = "kontainy.__main__:main"
kty = "kontainy.__main__:main"

[project.gui-scripts]
# On Windows this starts the window without a console, as VenvStudio's
# venvstudio-gui does. Elsewhere it is the same as running `ky`.
kontainy-gui = "kontainy.__main__:gui_main"

[tool.setuptools.packages.find]
# Discovered, never listed by hand. 0.0.4 shipped to PyPI without
# kontainy/core/providers because the package list was written out manually
# and nobody added the new directory to it; `ky -V` worked and the window
# could not open. The import package is still named after the project, so
# nothing called "src" or "main" can reach site-packages.
include = ["kontainy", "kontainy.*"]
