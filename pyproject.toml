[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kontainy"
version = "0.0.4"
description = "Every Docker and Podman setting, in one interface - a desktop manager for containers, with diagnostics and built-in learning"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bayram Kotan" }]
keywords = [
    "docker", "podman", "container", "containers", "kubernetes", "quadlet",
    "systemd", "rootless", "oci", "devops", "gui", "pyside6", "qt", "linux",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Installation/Setup",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Education",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/bayramkotan/kontainy"
Repository = "https://github.com/bayramkotan/kontainy"
Issues = "https://github.com/bayramkotan/kontainy/issues"
Changelog = "https://github.com/bayramkotan/kontainy/releases"

[project.scripts]
# `ky` is the short form, the way VenvStudio installs `vs` alongside its own
# name. `kty` is kept from 0.0.1 so nobody's muscle memory breaks.
kontainy = "kontainy.__main__:main"
ky = "kontainy.__main__:main"
kty = "kontainy.__main__:main"

[tool.setuptools]
# The import package is named after the project on purpose. Shipping a
# top-level "src" package or a bare "main" module would collide with every
# other distribution that does the same, and would shadow anything the user
# imports by that name.
packages = [
    "kontainy", "kontainy.core", "kontainy.core.catalog", "kontainy.gui",
    "kontainy.gui.pages", "kontainy.gui.dialogs", "kontainy.rules",
    "kontainy.learn", "kontainy.utils",
]
